name: validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[test,upstream]'
      - run: python -m copperscript_stm32g0 validate
      - run: python -m pytest
      - run: python -m copperscript_stm32g0 generate
      - run: python -m copperscript_stm32g0 check
      - run: copper check tests/fixtures/compiler_smoke.copper
      - run: copper compile tests/fixtures/compiler_smoke.copper --no-check -o work/compiler-smoke.json
      - run: git diff --exit-code
