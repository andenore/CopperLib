name: validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned CopperScript compiler
        uses: actions/checkout@v4
        with:
          repository: andenore/CopperScript
          ref: eb926375f2318ea15c89ec92873c3263af730609
          path: cache/ci/CopperScript
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install compiler and test dependencies
        run: python -m pip install -e './cache/ci/CopperScript[test]'
      - run: python -m pytest tests
      - run: python packages/profiles/raspberry_pi/cm4/generate.py --check
      - run: copper check tests/fixtures/compiler_smoke.copper
      - run: copper compile tests/fixtures/compiler_smoke.copper --no-check -o work/compiler-smoke.json
      - run: git diff --exit-code
