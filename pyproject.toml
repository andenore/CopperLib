[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copperscript-device-model-lab"
version = "0.1.0"
description = "Evidence-backed cross-vendor device-model compatibility lab for CopperScript"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]
upstream = ["copperscript @ git+https://github.com/andenore/CopperScript.git@d856f2bc6c6aa86d5b2a95d79cc1883336a01081"]

[project.scripts]
copperscript-stm32g0 = "copperscript_stm32g0.cli:main"

[tool.setuptools]
packages = ["copperscript_stm32g0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
